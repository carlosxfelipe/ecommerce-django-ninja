[project]
name = "ecommerce-django-ninja"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.1",
    "django-ninja-jwt>=5.4.5",
    "email-validator>=2.3.0",
    "scalar-ninja>=0.3.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "ruff>=0.17.0",
]

# The editor's static analysis doesn't run settings.py, so it can't see
# sys.path.insert(0, BASE_DIR / "apps"). Tell it where apps live.
[tool.pyrefly]
search-path = ["apps"]

[tool.pyright]
extraPaths = ["apps"]

[tool.ty.environment]
extra-paths = ["apps"]
